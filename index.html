<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>カウントダウンタイマー</title>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-M8DX6LNS');</script>
  <!-- End Google Tag Manager -->
  <style>
    :root {
      --page-padding: clamp(12px, 4vw, 32px);
      --display-size: clamp(64px, 25vw, 260px);
      --message-size: clamp(28px, 8vw, 60px);
      --control-size: clamp(16px, 4vw, 24px);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html,
    body {
      width: 100%;
      min-height: 100%;
    }
    
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(var(--page-padding), env(safe-area-inset-top))
        max(var(--page-padding), env(safe-area-inset-right))
        max(var(--page-padding), env(safe-area-inset-bottom))
        max(var(--page-padding), env(safe-area-inset-left));
      overflow-x: hidden;
      background-color: #000;
      color: #fff;
      transition: background-color 0.3s;
    }
    
    body.overtime {
      background-color: #8b0000;
    }
    
    body.blink {
      animation: blinkBg 0.5s infinite;
    }
    
    @keyframes blinkBg {
      0%, 100% { background-color: #8b0000; }
      50% { background-color: #4a0000; }
    }
    
    .container {
      width: min(100%, 1200px);
      text-align: center;
    }
    
    .message {
      min-height: 1.2em;
      margin-bottom: clamp(8px, 2vh, 20px);
      color: #ff6b6b;
      font-size: var(--message-size);
      font-weight: bold;
      line-height: 1.15;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .message.show {
      opacity: 1;
    }
    
    .display {
      margin: clamp(12px, 4vh, 40px) 0 clamp(12px, 2vh, 20px);
      font-size: var(--display-size);
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    
    .progress-container {
      width: min(80%, 600px);
      height: clamp(12px, 2.5vw, 20px);
      margin: 0 auto clamp(20px, 5vh, 40px);
      overflow: hidden;
      border-radius: 999px;
      background-color: #333;
      opacity: 1;
      transition: opacity 0.3s;
    }
    
    .progress-container.hidden {
      opacity: 0;
    }
    
    .progress-bar {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background-color: #fff;
      transition: width 0.3s linear;
    }
    
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: clamp(16px, 4vh, 30px) 0;
    }
    
    label {
      font-size: clamp(16px, 3.5vw, 20px);
    }
    
    select {
      max-width: 100%;
      min-height: 48px;
      padding: 8px 14px;
      border: 2px solid #fff;
      border-radius: 5px;
      background-color: transparent;
      color: #fff;
      font-size: var(--control-size);
      cursor: pointer;
    }
    
    select:focus-visible,
    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    
    select option {
      background-color: #fff;
      color: #000;
    }
    
    .button-group {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
      width: min(100%, 760px);
      margin: 0 auto;
    }
    
    button {
      min-height: 52px;
      padding: 12px 18px;
      border: none;
      border-radius: 5px;
      font-size: var(--control-size);
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.2s, transform 0.1s;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .start-btn { background-color: #4CAF50; color: #fff; }
    .start-btn:hover { background-color: #45a049; }
    .start-btn:disabled { background-color: #666; cursor: not-allowed; }
    .stop-btn { background-color: #f44336; color: #fff; }
    .stop-btn:hover { background-color: #da190b; }
    .reset-btn { background-color: #2196F3; color: #fff; }
    .reset-btn:hover { background-color: #0b7dda; }
    .hurry-btn { background-color: #FF9800; color: #fff; }
    .hurry-btn:hover { background-color: #e68900; }
    
    /* iPhoneなどの狭い画面 */
    @media (max-width: 600px) {
      :root {
        --display-size: clamp(58px, 23vw, 100px);
      }
    
      .container {
        width: 100%;
      }
    
      .progress-container {
        width: 92%;
      }
    
      .button-group {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
    
      button {
        width: 100%;
        padding-inline: 8px;
      }
    }
    
    /* 高さが小さい端末やiPhone横向き */
    @media (max-height: 520px) and (orientation: landscape) {
      body {
        align-items: flex-start;
      }
    
      :root {
        --display-size: clamp(54px, 18vh, 92px);
        --message-size: clamp(22px, 7vh, 36px);
        --control-size: 16px;
      }
    
      .message {
        margin-bottom: 4px;
      }
    
      .display {
        margin: 6px 0 10px;
      }
    
      .progress-container {
        width: min(70%, 600px);
        margin-bottom: 10px;
      }
    
      .controls {
        margin: 8px 0;
      }
    
      .button-group {
        grid-template-columns: repeat(4, minmax(90px, 1fr));
        gap: 8px;
      }
    
      button,
      select {
        min-height: 42px;
        padding-block: 8px;
      }
    }
    
    /* 点滅を抑える設定を利用している場合 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M8DX6LNS"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main class="container">
    <div class="message" id="message" aria-live="polite">巻きでお願いします</div>
    <div class="display" id="display" role="timer" aria-live="off">15:00</div>
    
    <div class="progress-container" id="progressContainer" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="controls">
      <label for="minutes">時間設定:</label>
      <select id="minutes">
        <option value="0.5">30秒</option>
        <option value="1">1分</option>
        <option value="1.5">1分30秒</option>
        <option value="2">2分</option>
        <option value="2.5">2分30秒</option>
        <option value="3">3分</option>
        <option value="3.5">3分30秒</option>
        <option value="4">4分</option>
        <option value="4.5">4分30秒</option>
        <option value="5">5分</option>
        <option value="5.5">5分30秒</option>
        <option value="6">6分</option>
        <option value="6.5">6分30秒</option>
        <option value="7">7分</option>
        <option value="7.5">7分30秒</option>
        <option value="8">8分</option>
        <option value="8.5">8分30秒</option>
        <option value="9">9分</option>
        <option value="9.5">9分30秒</option>
        <option value="10">10分</option>
        <option value="10.5">10分30秒</option>
        <option value="11">11分</option>
        <option value="11.5">11分30秒</option>
        <option value="12">12分</option>
        <option value="12.5">12分30秒</option>
        <option value="13">13分</option>
        <option value="13.5">13分30秒</option>
        <option value="14">14分</option>
        <option value="14.5">14分30秒</option>
        <option value="15" selected>15分</option>
        <option value="15.5">15分30秒</option>
        <option value="16">16分</option>
        <option value="16.5">16分30秒</option>
        <option value="17">17分</option>
        <option value="17.5">17分30秒</option>
        <option value="18">18分</option>
        <option value="18.5">18分30秒</option>
        <option value="19">19分</option>
        <option value="19.5">19分30秒</option>
        <option value="20">20分</option>
        <option value="20.5">20分30秒</option>
        <option value="21">21分</option>
        <option value="21.5">21分30秒</option>
        <option value="22">22分</option>
        <option value="22.5">22分30秒</option>
        <option value="23">23分</option>
        <option value="23.5">23分30秒</option>
        <option value="24">24分</option>
        <option value="24.5">24分30秒</option>
        <option value="25">25分</option>
        <option value="25.5">25分30秒</option>
        <option value="26">26分</option>
        <option value="26.5">26分30秒</option>
        <option value="27">27分</option>
        <option value="27.5">27分30秒</option>
        <option value="28">28分</option>
        <option value="28.5">28分30秒</option>
        <option value="29">29分</option>
        <option value="29.5">29分30秒</option>
        <option value="30">30分</option>
      </select>
    </div>
    <div class="button-group">
      <button type="button" class="start-btn" id="startBtn">スタート</button>
      <button type="button" class="stop-btn" id="stopBtn">ストップ</button>
      <button type="button" class="reset-btn" id="resetBtn">リセット</button>
      <button type="button" class="hurry-btn" id="hurryBtn" aria-pressed="false">巻きで</button>
    </div>
  </main>

  <script>
    let remainingSeconds = 0;
    let totalSeconds = 0;
    let intervalId = null;
    let isRunning = false;
    let isHurryMode = false;

    const display = document.getElementById('display');
    const message = document.getElementById('message');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const minutesSelect = document.getElementById('minutes');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const hurryBtn = document.getElementById('hurryBtn');

    function formatTime(seconds) {
      const isNegative = seconds < 0;
      const absSeconds = Math.abs(seconds);
      const mins = Math.floor(absSeconds / 60);
      const secs = absSeconds % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      return isNegative ? '-' + formatted : formatted;
    }

    function updateDisplay() {
      display.textContent = formatTime(remainingSeconds);
      
      if (remainingSeconds < 0) {
        document.body.classList.add('overtime');
        progressContainer.classList.add('hidden');
      } else {
        document.body.classList.remove('overtime');
        progressContainer.classList.remove('hidden');
        const percentage = (remainingSeconds / totalSeconds) * 100;
        progressBar.style.width = percentage + '%';
      }
    }

    function startTimer() {
      if (isRunning) return;
      
      if (remainingSeconds === 0 || remainingSeconds === totalSeconds) {
        totalSeconds = Math.floor(parseFloat(minutesSelect.value) * 60);
        remainingSeconds = totalSeconds;
      }
      
      isRunning = true;
      startBtn.disabled = true;
      
      intervalId = setInterval(() => {
        remainingSeconds--;
        updateDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (!isRunning) return;
      
      isRunning = false;
      startBtn.disabled = false;
      clearInterval(intervalId);
      intervalId = null;
    }

    function resetTimer() {
      const confirmed = confirm('タイマーをリセットしてもよろしいですか？');
      if (!confirmed) {
        return;
      }
      stopTimer();
      isHurryMode = false;
      message.classList.remove('show');
      document.body.classList.remove('blink');
      totalSeconds = Math.floor(parseFloat(minutesSelect.value) * 60);
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    function toggleHurryMode() {
      isHurryMode = !isHurryMode;
      if (isHurryMode) {
        message.classList.add('show');
        document.body.classList.add('blink');
        hurryBtn.textContent = '解除';
      } else {
        message.classList.remove('show');
        document.body.classList.remove('blink');
        hurryBtn.textContent = '巻きで';
      }
    }

    startBtn.addEventListener('click', startTimer);
    stopBtn.addEventListener('click', stopTimer);
    resetBtn.addEventListener('click', resetTimer);
    hurryBtn.addEventListener('click', toggleHurryMode);
    
    minutesSelect.addEventListener('change', () => {
      if (!isRunning) {
        totalSeconds = Math.floor(parseFloat(minutesSelect.value) * 60);
        remainingSeconds = totalSeconds;
        updateDisplay();
      }
    });

    // 初期表示
    totalSeconds = Math.floor(parseFloat(minutesSelect.value) * 60);
    remainingSeconds = totalSeconds;
    updateDisplay();
  </script>
</body>
</html>
